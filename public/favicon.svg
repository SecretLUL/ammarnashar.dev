<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Ammar Nashar</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11211a"/>
      <stop offset="1" stop-color="#040806"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="14" y1="46" x2="52" y2="18">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="0.5" stop-color="#6ee7a0"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#86efac" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- A and N as one continuous line, like a heartbeat trace -->
  <polyline points="15,45 25,19 35,45 35,19 49,45 49,19" fill="none" stroke="url(#ink)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
